name: Poll job boards

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: poll-job-boards
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run poller
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: go run ./cmd/poller

      - name: Commit updated jobs.db
        run: |
          git config user.name "job-poller-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jobs.db
          if git diff --cached --quiet -- jobs.db; then
            echo "no changes to jobs.db"
            exit 0
          fi
          git commit -m "Update jobs.db [skip ci]"
          git push
